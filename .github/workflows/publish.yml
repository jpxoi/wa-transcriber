# Publish to PyPI and create a GitHub Release when you push a version tag (e.g. v1.3.1).
# Maintainer flow: RELEASING.md
#
# One-time PyPI setup (Trusted Publishing — no API token in GitHub):
#   https://docs.pypi.org/trusted-publishers/adding-a-publisher/
#   Project: wa-transcriber → Add → GitHub → repo jpxoi/wa-transcriber, workflow: publish.yml
#
name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Verify tag matches pyproject.toml version
        run: |
          set -euo pipefail
          VER="$(uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$VER" != "$TAG" ]; then
            echo "::error::Version mismatch: pyproject.toml has $VER but tag is $GITHUB_REF_NAME (expected v$VER)"
            exit 1
          fi
          echo "Version $VER matches tag $GITHUB_REF_NAME"

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
